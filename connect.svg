<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 290" width="100%" height="100%">
  <defs>
    <!-- Aurora Gradients -->
    <linearGradient id="conn-aurora" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="50%" stop-color="#a78bfa" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>

    <linearGradient id="conn-card-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f111a" />
      <stop offset="100%" stop-color="#090a10" />
    </linearGradient>

    <linearGradient id="conn-card-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.8" />
      <stop offset="40%" stop-color="#a78bfa" stop-opacity="0.3" />
      <stop offset="70%" stop-color="#f472b6" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0.4" />
    </linearGradient>

    <pattern id="conn-dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#ffffff" fill-opacity="0.04" />
    </pattern>

    <filter id="neon-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      .mono { font-family: 'JetBrains Mono', 'Fira Code', 'Roboto Mono', monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }

      /* Arrow Nudging Animation */
      @keyframes nudgeArrow {
        0%, 100% { transform: translateX(0px); }
        50% { transform: translateX(6px); }
      }
      .arrow-nudge { animation: nudgeArrow 1.6s ease-in-out infinite; }

      /* Neon Sign Glow */
      @keyframes neonFlicker {
        0%, 100% { opacity: 0.95; }
        48% { opacity: 0.9; }
        50% { opacity: 0.7; }
        52% { opacity: 0.95; }
        85% { opacity: 0.95; }
        87% { opacity: 0.8; }
      }
      .neon-sign { animation: neonFlicker 5s infinite; }

      /* Character Pointing Bounce */
      @keyframes pointGentle {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-4px); }
      }
      .character-group { animation: pointGentle 3s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Background Card -->
  <rect x="2" y="2" width="896" height="286" rx="16" fill="url(#conn-card-bg)" stroke="url(#conn-card-border)" stroke-width="1.5" />
  <rect x="2" y="2" width="896" height="286" rx="16" fill="url(#conn-dots)" />

  <!-- ================= LEFT: CHARACTER & NEON SIGN ================= -->
  <g transform="translate(42, 30)">
    <!-- Neon Signboard: @g2rindian2005-cyber -->
    <g class="neon-sign" transform="translate(0, 10)">
      <!-- Neon Sign Box -->
      <rect x="0" y="0" width="260" height="38" rx="8" fill="#17122a" stroke="#f472b6" stroke-width="1.2" filter="url(#neon-glow)" opacity="0.4" />
      <rect x="0" y="0" width="260" height="38" rx="8" fill="#0d0e17" stroke="#f472b6" stroke-width="1" />
      <text x="130" y="24" text-anchor="middle" fill="#f472b6" font-size="12" font-weight="800" class="mono" letter-spacing="1">
        ✨ @g2rindian2005-cyber ✨
      </text>
    </g>

    <!-- Pointing Character Avatar Illustration -->
    <g class="character-group" transform="translate(18, 62)">
      <!-- Backdrop Halo -->
      <circle cx="110" cy="85" r="75" fill="#a78bfa" fill-opacity="0.08" filter="url(#neon-glow)" />

      <!-- Body / Jacket (white zip hoodie aesthetic) -->
      <path d="M 65 175 C 65 130 90 120 110 120 C 130 120 155 130 155 175 Z" fill="#334155" stroke="#64748b" stroke-width="1.5" />
      <path d="M 98 126 L 110 148 L 122 126 Z" fill="#eab308" /> <!-- Yellow inner tee -->
      <line x1="110" y1="148" x2="110" y2="175" stroke="#94a3b8" stroke-width="2" /> <!-- Zipper -->

      <!-- Head & Hair -->
      <circle cx="110" cy="80" r="32" fill="#fed7aa" /> <!-- Face -->
      <!-- Stylish Hair -->
      <path d="M 78 80 C 78 45 92 42 110 42 C 128 42 142 45 142 80 C 142 86 138 68 132 64 C 122 58 98 58 88 64 C 82 68 78 86 78 80 Z" fill="#1e293b" />
      
      <!-- Sunglasses on Head -->
      <rect x="88" y="52" width="18" height="9" rx="3" fill="#0284c7" stroke="#38bdf8" stroke-width="1" />
      <rect x="114" y="52" width="18" height="9" rx="3" fill="#0284c7" stroke="#38bdf8" stroke-width="1" />
      <line x1="106" y1="56" x2="114" y2="56" stroke="#38bdf8" stroke-width="1.2" />

      <!-- Eyes & Smile (Winking face) -->
      <circle cx="100" cy="80" r="3.2" fill="#0f172a" /> <!-- Left eye open -->
      <!-- Right eye winking -->
      <path d="M 118 82 Q 124 77 128 82" fill="none" stroke="#0f172a" stroke-width="2" stroke-linecap="round" />
      <!-- Warm smile -->
      <path d="M 104 94 Q 112 102 120 94" fill="none" stroke="#0f172a" stroke-width="2" stroke-linecap="round" />
      <!-- Cheeks blush -->
      <circle cx="95" cy="88" r="4" fill="#fb7185" opacity="0.5" />
      <circle cx="127" cy="88" r="4" fill="#fb7185" opacity="0.5" />

      <!-- Pointing Arm (Reaching towards right with pointing hand) -->
      <!-- Arm -->
      <path d="M 148 140 Q 185 130 200 126" fill="none" stroke="#334155" stroke-width="12" stroke-linecap="round" />
      <!-- Hand pointing finger -->
      <circle cx="204" cy="125" r="7" fill="#fed7aa" />
      <!-- Index Finger pointing -->
      <rect x="204" y="122" width="18" height="6" rx="3" fill="#fed7aa" />
      
      <!-- Sparkle & Energy Sparks at finger tip -->
      <path d="M 230 125 L 236 125 M 233 122 L 233 128" stroke="#22d3ee" stroke-width="2" stroke-linecap="round" />
      <circle cx="233" cy="125" r="1.5" fill="#f472b6" />
    </g>

    <!-- Bottom Status Caption -->
    <text x="130" y="248" text-anchor="middle" fill="#94a3b8" font-size="11" class="mono">
      LET'S CONNECT &amp; COLLABORATE
    </text>
  </g>

  <!-- ================= RIGHT: 4 CONNECT LINK CARDS ================= -->
  <g transform="translate(350, 24)">
    <!-- Header -->
    <text x="0" y="14" fill="url(#conn-aurora)" font-size="16" font-weight="900" class="sans" letter-spacing="0.8">
      LET'S TALK CLOUD, DEVOPS &amp; OPPORTUNITIES
    </text>
    <text x="0" y="32" fill="#94a3b8" font-size="11" class="sans">
      Feel free to reach out for full-time engineering roles, consulting, or technical mentorship.
    </text>

    <!-- 4 Cards Grid (2x2) -->
    <!-- Card 1: GitHub -->
    <g transform="translate(0, 48)">
      <rect x="0" y="0" width="250" height="74" rx="10" fill="#111827" stroke="#1e293b" stroke-width="1" />
      <!-- Icon Box -->
      <rect x="12" y="14" width="46" height="46" rx="8" fill="#1f2937" stroke="#374151" stroke-width="1" />
      <text x="35" y="44" text-anchor="middle" font-size="22">🐙</text>
      <!-- Texts -->
      <text x="68" y="32" fill="#f8fafc" font-size="13" font-weight="700" class="sans">GitHub Profile</text>
      <text x="68" y="49" fill="#94a3b8" font-size="10.5" class="mono">g2rindian2005-cyber</text>
      <!-- Nudging Arrow -->
      <g class="arrow-nudge" transform="translate(222, 42)">
        <path d="M 0 0 L 8 0 M 4 -4 L 8 0 L 4 4" fill="none" stroke="#22d3ee" stroke-width="2" stroke-linecap="round" />
      </g>
    </g>

    <!-- Card 2: LinkedIn -->
    <g transform="translate(268, 48)">
      <rect x="0" y="0" width="250" height="74" rx="10" fill="#111827" stroke="#1e293b" stroke-width="1" />
      <rect x="12" y="14" width="46" height="46" rx="8" fill="#082f49" stroke="#0284c7" stroke-width="1" />
      <text x="35" y="44" text-anchor="middle" font-size="22">💼</text>
      <text x="68" y="32" fill="#f8fafc" font-size="13" font-weight="700" class="sans">LinkedIn</text>
      <text x="68" y="49" fill="#94a3b8" font-size="10.5" class="mono">in/gokul-rathod</text>
      <g class="arrow-nudge" transform="translate(222, 42)">
        <path d="M 0 0 L 8 0 M 4 -4 L 8 0 L 4 4" fill="none" stroke="#a78bfa" stroke-width="2" stroke-linecap="round" />
      </g>
    </g>

    <!-- Card 3: Direct Email -->
    <g transform="translate(0, 134)">
      <rect x="0" y="0" width="250" height="74" rx="10" fill="#111827" stroke="#1e293b" stroke-width="1" />
      <rect x="12" y="14" width="46" height="46" rx="8" fill="#311425" stroke="#db2777" stroke-width="1" />
      <text x="35" y="44" text-anchor="middle" font-size="22">✉️</text>
      <text x="68" y="32" fill="#f8fafc" font-size="13" font-weight="700" class="sans">Direct Email</text>
      <text x="68" y="49" fill="#94a3b8" font-size="10" class="mono">g2rindian2005@gmail.com</text>
      <g class="arrow-nudge" transform="translate(222, 42)">
        <path d="M 0 0 L 8 0 M 4 -4 L 8 0 L 4 4" fill="none" stroke="#f472b6" stroke-width="2" stroke-linecap="round" />
      </g>
    </g>

    <!-- Card 4: Location & Phone -->
    <g transform="translate(268, 134)">
      <rect x="0" y="0" width="250" height="74" rx="10" fill="#111827" stroke="#1e293b" stroke-width="1" />
      <rect x="12" y="14" width="46" height="46" rx="8" fill="#14532d" stroke="#16a34a" stroke-width="1" />
      <text x="35" y="44" text-anchor="middle" font-size="22">📍</text>
      <text x="68" y="32" fill="#f8fafc" font-size="13" font-weight="700" class="sans">Hyderabad, India</text>
      <text x="68" y="49" fill="#94a3b8" font-size="10.5" class="mono">+91 9356782322</text>
      <g class="arrow-nudge" transform="translate(222, 42)">
        <path d="M 0 0 L 8 0 M 4 -4 L 8 0 L 4 4" fill="none" stroke="#4ade80" stroke-width="2" stroke-linecap="round" />
      </g>
    </g>

    <!-- Subtle Footer Note -->
    <text x="0" y="228" fill="#64748b" font-size="10" class="mono">
      ⚡ RESPONSE TIME: &lt; 24 HOURS // READY TO RELOCATE OR WORK REMOTE
    </text>
  </g>
</svg>
